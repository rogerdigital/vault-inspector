name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Obsidian warning lint
        run: npm run lint:obsidian-warnings

      - name: Type check & build
        run: npm run build

      - name: Test
        run: npm test

      - name: Package dry run
        run: npm pack --dry-run
