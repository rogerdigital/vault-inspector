name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Verify tag version and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/check-release-version.mjs "$RELEASE_TAG"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - run: npm ci
      - run: npm run lint
      - run: npm run lint:obsidian-warnings
      - run: npm run build
      - run: npm run test:coverage
      - run: npm pack --dry-run
      - name: Verify installed package
        run: |
          set -euo pipefail
          mkdir release-package
          npm pack --pack-destination release-package
          packages=(release-package/*.tgz)
          test "${#packages[@]}" -eq 1
          node scripts/smoke-installed-cli.mjs "${packages[0]}"
      - uses: actions/setup-node@v6
        with:
          node-version: 18
      - name: Verify minimum Node runtime
        run: |
          set -euo pipefail
          packages=(release-package/*.tgz)
          test "${#packages[@]}" -eq 1
          node scripts/smoke-installed-cli.mjs "${packages[0]}"
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" &>/dev/null; then
            gh release upload "$tag" main.js manifest.json styles.css --clobber
          else
            gh release create "$tag" \
              --title "$tag" \
              --generate-notes \
              main.js manifest.json styles.css
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
